<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

    <title>Nueva Solicitud</title>

</head>
<body>

<div class="container mt-5">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <a
                th:href="@{/admin/proveedores}"
                class="btn btn-outline-secondary">
            ← Volver
        </a>

        <h1 class="m-0 text-primary">
            Nueva Solicitud de Compra
        </h1>

        <div style="width:100px;"></div>

    </div>

    <div class="row justify-content-center">

        <div class="col-lg-8">

            <div class="card shadow border-0">

                <div class="card-header bg-primary text-white">

                    <h5 class="m-0">
                        Información de la Solicitud
                    </h5>

                </div>

                <div class="card-body">

                    <form
                            th:action="@{/admin/solicitudes}"
                            method="post"
                            th:object="${solicitudCompra}">

                        <div class="mb-3">

                            <input
                                    type="text"
                                    th:field="*{codigo}"
                                    placeholder="Código"
                                    class="form-control">

                        </div>

                        <div class="mb-3">

                            <input
                                    type="text"
                                    th:field="*{titulo}"
                                    placeholder="Título"
                                    class="form-control">

                        </div>

                        <div class="mb-3">

                            <textarea
                                    th:field="*{descripcion}"
                                    placeholder="Descripción"
                                    class="form-control"
                                    rows="4">
                            </textarea>

                        </div>

                        <div class="mb-4">

                            <div class="mb-3">

                                <input
                                        type="date"
                                        th:field="*{fechaInicio}"
                                        class="form-control">

                            </div>

                            <div class="mb-4">

                                <input
                                        type="date"
                                        th:field="*{fechaFin}"
                                        class="form-control">

                            </div>

                        </div>

                        <button
                                type="submit"
                                class="btn btn-primary w-100">

                            Publicar Solicitud

                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
