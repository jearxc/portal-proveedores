<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">
    <title>Auditoría</title>
</head>
<body>
<div class="d-flex justify-content-between align-items-center mb-4">

    <h1 class="text-primary m-0">
        Auditoría del Sistema
    </h1>

    <div class="d-flex gap-2">

        <a
                th:href="@{/admin/proveedores}"
                class="btn btn-secondary">
            Volver a Proveedores
        </a>

        <form th:action="@{/logout}" method="post">

            <button
                    type="submit"
                    class="btn btn-danger">
                Cerrar Sesión
            </button>

        </form>

    </div>

</div>
<br><br>

    <table class="table table-striped table-hover align-middle">

    <tr>
        <th>ID</th>
        <th>Acción</th>
        <th>Descripción</th>
        <th>Usuario</th>
        <th>Fecha</th>
    </tr>

    <tr th:each="auditoria : ${auditorias}">

        <td th:text="${auditoria.id}"></td>

        <td>

    <span
            th:if="${auditoria.accion == 'REGISTRO'}"
            class="badge bg-primary">
        REGISTRO
    </span>

            <span
                    th:if="${auditoria.accion == 'APROBACION'}"
                    class="badge bg-success">
        APROBACION
    </span>

            <span
                    th:if="${auditoria.accion == 'RECHAZO'}"
                    class="badge bg-danger">
        RECHAZO
    </span>

        </td>

        <td th:text="${auditoria.descripcion}"></td>

        <td th:text="${auditoria.usuario}"></td>

        <td th:text="${auditoria.fecha}"></td>

    </tr>

</table>
</div>
</body>
</html>
