<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

    <title>Portal de Proveedores</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

</head>
<body class="bg-light">

<div class="container">

    <div class="row vh-100 align-items-center">

        <div class="col-md-8 mx-auto text-center">

            <h1 class="display-2 text-primary fw-bold">
                Portal de Proveedores
            </h1>

            <p class="lead mt-4">

                Plataforma para la gestión de proveedores,
                solicitudes de compra y propuestas comerciales.

            </p>

            <div class="mt-4">

                <a
                        th:href="@{/login}"
                        class="btn btn-primary btn-lg me-3">

                    Iniciar Sesión

                </a>

                <a
                        th:href="@{/registro}"
                        class="btn btn-outline-primary btn-lg">

                    Registrarse

                </a>

            </div>

            <div class="row mt-5">

                <div class="col-md-3">

                    <div class="card shadow-sm">
                        <div class="card-body">
                            ✅ Gestión de Proveedores
                        </div>
                    </div>

                </div>

                <div class="col-md-3">

                    <div class="card shadow-sm">
                        <div class="card-body">
                            📋 Solicitudes de Compra
                        </div>
                    </div>

                </div>

                <div class="col-md-3">

                    <div class="card shadow-sm">
                        <div class="card-body">
                            📄 Propuestas PDF
                        </div>
                    </div>

                </div>

                <div class="col-md-3">

                    <div class="card shadow-sm">
                        <div class="card-body">
                            🔍 Auditoría
                        </div>
                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
