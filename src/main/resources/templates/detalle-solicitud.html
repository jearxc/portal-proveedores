<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

    <title>Detalle de Solicitud</title>

</head>
<body>

<div class="container mt-5">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <h1 class="text-primary">
            Detalle de Solicitud
        </h1>

        <a
                th:href="@{/admin/solicitudes}"
                class="btn btn-outline-secondary">

            Volver

        </a>

    </div>

    <div class="card shadow">

        <div class="card-body">

            <h4 th:text="${solicitud.titulo}">
            </h4>

            <hr>

            <p>
                <strong>Código:</strong>
                <span th:text="${solicitud.codigo}">
                </span>
            </p>

            <p>
                <strong>Descripción:</strong>
                <span th:text="${solicitud.descripcion}">
                </span>
            </p>

            <p>
                <strong>Fecha Inicio:</strong>
                <span th:text="${solicitud.fechaInicio}">
                </span>
            </p>

            <p>
                <strong>Fecha Fin:</strong>
                <span th:text="${solicitud.fechaFin}">
                </span>
            </p>

            <p>
                <strong>Estado:</strong>

                <span
                        th:if="${solicitud.estado.name() == 'ABIERTA'}"
                        class="badge bg-success">

                    ABIERTA

                </span>

                <span
                        th:if="${solicitud.estado.name() == 'CERRADA'}"
                        class="badge bg-danger">

                    CERRADA

                </span>

            </p>
            <hr>

            <h4 class="mt-4">
                Propuestas Recibidas
            </h4>

            <div class="table-responsive">

                <table class="table table-striped">

                    <thead class="table-dark">

                    <tr>


                        <th>Proveedor</th>
                        <th>Archivo</th>
                        <th>Acción</th>

                    </tr>

                    </thead>

                    <tbody>

                    <tr
                            th:if="${#lists.isEmpty(propuestas)}">

                        <td colspan="2"
                            class="text-center text-muted">

                            No existen propuestas registradas.

                        </td>

                    </tr>

                    <tr
                            th:each="propuesta : ${propuestas}">

                        <td
                                th:text="${propuesta.proveedor.razonSocial}">
                        </td>

                        <td
                                th:text="${propuesta.nombreArchivo}">
                        </td>
                        <td>

                            <a
                                    th:href="@{/admin/propuestas/descargar/{id}(id=${propuesta.id})}"
                                    class="btn btn-primary btn-sm">

                                Descargar PDF

                            </a>

                        </td>

                    </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>

</body>
</html>
