<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

    <title>Detalle de Solicitud</title>

</head>
<body>

<div class="container mt-5">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <h1 class="text-primary">
            Detalle de Solicitud
        </h1>

        <a
                th:href="@{/admin/solicitudes}"
                class="btn btn-outline-secondary">

            Volver

        </a>

    </div>

    <div class="card shadow">

        <div class="card-body">

            <h4 th:text="${solicitud.titulo}">
            </h4>

            <hr>

            <p>
                <strong>Código:</strong>
                <span th:text="${solicitud.codigo}">
                </span>
            </p>

            <p>
                <strong>Descripción:</strong>
                <span th:text="${solicitud.descripcion}">
                </span>
            </p>

            <p>
                <strong>Fecha Inicio:</strong>
                <span th:text="${solicitud.fechaInicio}">
                </span>
            </p>

            <p>
                <strong>Fecha Fin:</strong>
                <span th:text="${solicitud.fechaFin}">
                </span>
            </p>

            <p>
                <strong>Estado:</strong>

                <span
                        th:if="${solicitud.estado.name() == 'ABIERTA'}"
                        class="badge bg-success">

                    ABIERTA

                </span>

                <span
                        th:if="${solicitud.estado.name() == 'CERRADA'}"
                        class="badge bg-danger">

                    CERRADA

                </span>
                <a
                        th:href="@{/proveedor/propuestas/{id}(id=${solicitud.id})}"
                        class="btn btn-success">

                    Enviar Propuesta

                </a>

            </p>

        </div>

    </div>

</div>

</body>
</html>
