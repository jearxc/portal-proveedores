<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

    <script src="https://www.google.com/recaptcha/api.js"
            async
            defer>
    </script>

    <title>Registro de Proveedor</title>

</head>

<body>

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-8">

            <h1 class="text-center mb-4">
                Registro de Proveedor
            </h1>

            <div
                    th:if="${mensaje}"
                    class="alert alert-success">

                <span th:text="${mensaje}"></span>

            </div>

            <div
                    th:if="${errorCaptcha}"
                    class="alert alert-danger">

                <span th:text="${errorCaptcha}"></span>

            </div>

            <div class="card shadow">

                <div class="card-body">

                    <form
                            th:action="@{/registro}"
                            method="post"
                            th:object="${registroProveedorDTO}">

                        <div class="mb-3">

                            <input
                                    type="text"
                                    th:field="*{ruc}"
                                    placeholder="RUC"
                                    class="form-control">

                            <div
                                    th:if="${#fields.hasErrors('ruc')}"
                                    th:errors="*{ruc}"
                                    class="text-danger">
                            </div>

                        </div>

                        <div class="mb-3">

                            <input
                                    type="text"
                                    th:field="*{razonSocial}"
                                    placeholder="Razón Social"
                                    class="form-control">

                            <div
                                    th:if="${#fields.hasErrors('razonSocial')}"
                                    th:errors="*{razonSocial}"
                                    class="text-danger">
                            </div>

                        </div>

                        <div class="mb-3">

                            <input
                                    type="text"
                                    th:field="*{telefono}"
                                    placeholder="Teléfono"
                                    class="form-control">

                            <div
                                    th:if="${#fields.hasErrors('telefono')}"
                                    th:errors="*{telefono}"
                                    class="text-danger">
                            </div>

                            <                           <input
                                type="text"
                                th:field="*{direccion}"
                                placeholder="Dirección"
                                class="form-control">

                            <div
                                    th:if="${#fields.hasErrors('direccion')}"
                                    th:errors="*{direccion}"
                                    class="text-danger">
                            </div>

                        </div>

                        <div class="mb-3">

                            <input
                                    type="email"
                                    th:field="*{email}"
                                    placeholder="Correo"
                                    class="form-control">

                            <div
                                    th:if="${#fields.hasErrors('email')}"
                                    th:errors="*{email}"
                                    class="text-danger">
                            </div>

                        </div>

                        <div class="mb-3">

                            <input
                                    type="text"
                                    th:field="*{username}"
                                    placeholder="Usuario"
                                    class="form-control">

                            <div
                                    th:if="${#fields.hasErrors('username')}"
                                    th:errors="*{username}"
                                    class="text-danger">
                            </div>

                        </div>

                        <div class="mb-3">

                            <input
                                    type="password"
                                    th:field="*{password}"
                                    placeholder="Contraseña"
                                    class="form-control">

                            <div
                                    th:if="${#fields.hasErrors('password')}"
                                    th:errors="*{password}"
                                    class="text-danger">
                            </div>

                        </div>

                        <!-- RECAPTCHA -->

                        <div class="mb-3 d-flex justify-content-center">

                            <div
                                    class="g-recaptcha"
                                    th:attr="data-sitekey=${siteKey}">
                            </div>

                        </div>

                        <button
                                type="submit"
                                class="btn btn-primary w-100">

                            Registrarse

                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
