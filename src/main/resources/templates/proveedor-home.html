<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">
    <title>Portal del Proveedor</title>
</head>
<body>
<div class="container mt-4">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <h1 class="text-primary m-0">
            Portal del Proveedor
        </h1>

        <div class="d-flex gap-2">
            <a
                    th:href="@{/admin/proveedores}"
                    class="btn btn-outline-secondary">
                ← Volver
            </a>
            <a
                    th:href="@{/proveedor/solicitudes}"
                    class="btn btn-primary">
                Ver Solicitudes
            </a>

            <form th:action="@{/logout}" method="post">

                <button
                        type="submit"
                        class="btn btn-danger">
                    Cerrar Sesión
                </button>

            </form>

        </div>

    </div>

    <div class="card shadow border-0 mb-4">

        <div class="card-header bg-primary text-white">

            <h5 class="m-0">
                Información del Proveedor
            </h5>

        </div>

        <div class="card-body">

            <div class="row">

                <div class="col-md-6 mb-3">

                    <div class="card border-primary h-100">

                        <div class="card-body">

                            <h6 class="text-muted">
                                Usuario
                            </h6>

                            <h5 th:text="${proveedor.usuario.username}">
                            </h5>

                        </div>

                    </div>

                </div>

                <div class="col-md-6 mb-3">

                    <div class="card border-info h-100">

                        <div class="card-body">

                            <h6 class="text-muted">
                                RUC
                            </h6>

                            <h5 th:text="${proveedor.ruc}">
                            </h5>

                        </div>

                    </div>

                </div>

                <div class="col-md-6 mb-3">

                    <div class="card border-secondary h-100">

                        <div class="card-body">

                            <h6 class="text-muted">
                                Razón Social
                            </h6>

                            <h5 th:text="${proveedor.razonSocial}">
                            </h5>

                        </div>

                    </div>

                </div>

                <div class="col-md-6 mb-3">

                    <div class="card border-success h-100">

                        <div class="card-body">

                            <h6 class="text-muted">
                                Estado
                            </h6>

                            <span
                                    th:if="${proveedor.estado.name() == 'APROBADO'}"
                                    class="badge bg-success fs-6">

                                APROBADO

                            </span>

                            <span
                                    th:if="${proveedor.estado.name() == 'PENDIENTE'}"
                                    class="badge bg-warning text-dark fs-6">

                                PENDIENTE

                            </span>

                            <span
                                    th:if="${proveedor.estado.name() == 'RECHAZADO'}"
                                    class="badge bg-danger fs-6">

                                RECHAZADO

                            </span>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>
