<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

    <title>Solicitudes de Compra</title>

</head>

<body>

<div class="container mt-5">

    <div
            id="successAlert"
            th:if="${param.success}"
            class="alert alert-success text-center">

         Solicitud publicada correctamente.

    </div>
    <div class="d-flex justify-content-between align-items-center mb-4">

        <h1 class="text-primary m-0">
            Solicitudes Publicadas
        </h1>

        <div class="d-flex gap-2">

            <a
                    th:href="@{/admin/solicitudes/nueva}"
                    class="btn btn-success">
                Nueva Solicitud
            </a>

            <a
                    th:href="@{/admin/proveedores}"
                    class="btn btn-outline-secondary">
                Volver
            </a>

        </div>

    </div>

    <div class="card shadow">

        <div class="card-body">

            <table class="table table-striped table-hover">

                <thead class="table-dark">

                <tr>
                    <th>Código</th>
                    <th>Título</th>
                    <th>Fecha Inicio</th>
                    <th>Fecha Fin</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                    <th>Detalle</th>
                </tr>

                </thead>

                <tbody>

                <tr th:if="${#lists.isEmpty(solicitudes)}">

                    <td colspan="5"
                        class="text-center text-muted">

                        No existen solicitudes registradas.

                    </td>

                </tr>

                <tr
                        th:each="solicitud : ${solicitudes}">

                    <td th:text="${solicitud.codigo}"></td>

                    <td th:text="${solicitud.titulo}"></td>

                    <td th:text="${solicitud.fechaInicio}"></td>

                    <td th:text="${solicitud.fechaFin}"></td>

                    <td>

                        <span
                                th:if="${solicitud.estado.name() == 'ABIERTA'}"
                                class="badge bg-success">

                            ABIERTA

                        </span>

                        <span
                                th:if="${solicitud.estado.name() == 'CERRADA'}"
                                class="badge bg-danger">

                            CERRADA

                        </span>
                    <td>

                        <div class="d-flex gap-2">

                            <form
                                    th:if="${solicitud.estado.name() == 'ABIERTA'}"
                                    th:action="@{/admin/solicitudes/cerrar/{id}(id=${solicitud.id})}"
                                    method="post">

                                <button
                                        type="submit"
                                        class="btn btn-warning btn-sm">

                                    Cerrar

                                </button>

                            </form>

                            <form
                                    th:if="${solicitud.estado.name() == 'CERRADA'}"
                                    th:action="@{/admin/solicitudes/reabrir/{id}(id=${solicitud.id})}"
                                    method="post">

                                <button
                                        type="submit"
                                        class="btn btn-success btn-sm">

                                    Reabrir

                                </button>

                            </form>

                            <form
                                    th:action="@{/admin/solicitudes/eliminar/{id}(id=${solicitud.id})}"
                                    method="post">

                                <button
                                        type="submit"
                                        class="btn btn-danger btn-sm">

                                    Eliminar

                                </button>

                            </form>
                            <td>

                                <a
                                        th:href="@{/admin/solicitudes/{id}(id=${solicitud.id})}"
                                        class="btn btn-primary btn-sm">

                                    Ver Detalle

                                </a>

                            </td>

                        </div>

                    </td>

                    </td>

                </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>
<script>

    setTimeout(() => {

        const alert =
            document.getElementById(
                'successAlert'
            );

        if(alert){

            alert.style.transition =
                'opacity 0.5s';

            alert.style.opacity = '0';

            setTimeout(() => {

                alert.remove();

            }, 500);

        }

    }, 2000);

</script>
</body>
</html>
