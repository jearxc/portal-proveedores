<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

    <title>Enviar Propuesta</title>

</head>
<body>

<div class="container mt-5">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <h1 class="text-primary m-0">
            Enviar Propuesta
        </h1>

        <a
                th:href="@{/proveedor/solicitudes}"
                class="btn btn-outline-secondary">

            Volver

        </a>

    </div>

    <div class="card shadow">

        <div class="card-body">

            <h4 th:text="${solicitud.titulo}">
            </h4>

            <p class="text-muted"
               th:text="${solicitud.codigo}">
            </p>
            <p>
                <strong>Descripción:</strong>
                <span th:text="${solicitud.descripcion}">
    </span>
            </p>

            <p>
                <strong>Fecha Fin:</strong>
                <span th:text="${solicitud.fechaFin}">
    </span>
            </p>

            <hr>

            <form
                    th:action="@{/proveedor/propuestas/{id}(id=${solicitud.id})}"
                    method="post"
                    enctype="multipart/form-data">

                <div class="mb-3">

                    <label class="form-label">
                        Archivo PDF
                    </label>

                    <input
                            type="file"
                            name="archivo"
                            accept=".pdf"
                            class="form-control">

                </div>

                <button
                        type="submit"
                        class="btn btn-primary w-100">

                    Enviar Propuesta

                </button>

            </form>

        </div>

    </div>

</div>

</body>
</html>
