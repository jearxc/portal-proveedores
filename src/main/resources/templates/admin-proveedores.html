<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">
    <title>Administración de Proveedores</title>
</head>
<body>
<div class="container mt-4">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <h1 class="text-primary m-0">
            Panel de Administración
        </h1>

        <div class="d-flex gap-2">
            <a
                    th:href="@{/admin/solicitudes/nueva}"
                    class="btn btn-success">
                Nueva Solicitud
            </a>
            <a
                    th:href="@{/admin/solicitudes}"
                    class="btn btn-primary">
                Ver Solicitudes
            </a>
            <a
                    th:href="@{/admin/auditoria}"
                    class="btn btn-primary">
                Ver Auditoría
            </a>

            <form th:action="@{/logout}" method="post">

                <button
                        type="submit"
                        class="btn btn-danger">
                    Cerrar Sesión
                </button>

            </form>

        </div>

    </div>

<br><br>

    <h2>Resumen</h2>

    <div class="row">

        <div class="col-md-3">
            <div class="card text-bg-primary mb-3">
                <div class="card-body">
                    <h5 class="card-title">Total</h5>
                    <h2 th:text="${total}"></h2>
                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card text-bg-warning mb-3">
                <div class="card-body">
                    <h5 class="card-title">Pendientes</h5>
                    <h2 th:text="${pendientes}"></h2>
                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card text-bg-success mb-3">
                <div class="card-body">
                    <h5 class="card-title">Aprobados</h5>
                    <h2 th:text="${aprobados}"></h2>
                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card text-bg-danger mb-3">
                <div class="card-body">
                    <h5 class="card-title">Rechazados</h5>
                    <h2 th:text="${rechazados}"></h2>
                </div>
            </div>
        </div>

    </div>

<hr>
    <hr>

    <h3 class="mb-3">
        Lista de Proveedores
    </h3>

    <table class="table table-striped table-hover align-middle">

    <tr>
        <th>ID</th>
        <th>RUC</th>
        <th>Razón Social</th>
        <th>Teléfono</th>
        <th>Estado</th>
        <th>Acciones</th>
    </tr>

    <tr th:each="proveedor : ${proveedores}">

        <td th:text="${proveedor.id}"></td>

        <td th:text="${proveedor.ruc}"></td>

        <td th:text="${proveedor.razonSocial}"></td>

        <td th:text="${proveedor.telefono}"></td>

        <td>

    <span
            th:if="${proveedor.estado.name() == 'APROBADO'}"
            class="badge bg-success">
        APROBADO
    </span>

            <span
                    th:if="${proveedor.estado.name() == 'PENDIENTE'}"
                    class="badge bg-warning text-dark">
        PENDIENTE
    </span>

            <span
                    th:if="${proveedor.estado.name() == 'RECHAZADO'}"
                    class="badge bg-danger">
        RECHAZADO
    </span>

        </td>

        <td>
            <div class="d-flex gap-2">
            <form
                    th:if="${proveedor.estado.name() == 'PENDIENTE'}"
                    th:action="@{/admin/proveedores/aprobar/{id}(id=${proveedor.id})}"
                    method="post">

                <button type="submit"
                class="btn btn-success">
                    Aprobar
                </button>

            </form>



            <form
                    th:if="${proveedor.estado.name() == 'PENDIENTE'}"
                    th:action="@{/admin/proveedores/rechazar/{id}(id=${proveedor.id})}"
                    method="post">

                <button type="submit"
                class="btn btn-danger">
                    Rechazar
                </button>
            </div>
            </form>

        </td>

    </tr>

</table>
    </div>
</body>
</html>
